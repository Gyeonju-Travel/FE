<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }
    .my-location {
      position: relative;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .my-location .pulse {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(90, 138, 106, 0.45);
      animation: my-location-pulse 2.2s ease-out infinite;
    }
    .my-location img {
      position: relative;
      width: 46px;
      height: 46px;
      z-index: 1;
    }
    @keyframes my-location-pulse {
      0% { transform: scale(1); opacity: 0.65; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .place-marker {
      position: relative;
      width: 72px;
      height: 82px;
      cursor: pointer;
    }
    .place-marker .pulse {
      position: absolute;
      left: 50%;
      bottom: 27px;
      width: 28px;
      height: 28px;
      margin-left: -14px;
      border-radius: 50%;
      animation: my-location-pulse 2.2s ease-out infinite;
    }
    .place-marker img {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 72px;
      height: 72px;
      margin-left: -36px;
      z-index: 1;
    }
    .place-marker--카페 .pulse { background: rgba(201, 123, 94, 0.5); }
    .place-marker--식당 .pulse { background: rgba(184, 118, 46, 0.5); }
    .place-marker--관광지 .pulse { background: rgba(90, 138, 106, 0.5); }
    .route-marker { width: 40px; height: 48px; cursor: pointer; }
    .route-marker img { width: 40px; height: 48px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // 마커/핀 이미지/경로 데이터는 개수가 많아지면 URL 쿼리스트링 길이 제한(예: Vercel 엣지의
    // 414 URI Too Long)에 걸릴 수 있어서, 초기 위치(key/lat/lng/level)만 URL로 받고
    // 나머지는 부모 창(React Native Web)이 postMessage로 보내주는 방식으로 받는다.
    function sendMessage(data) {
      if (window.parent) {
        window.parent.postMessage(JSON.stringify(data), '*');
      }
    }

    var params = new URLSearchParams(window.location.search);
    var kakaoJsKey = params.get('key') || '';
    var centerLat = parseFloat(params.get('lat')) || 35.8562;
    var centerLng = parseFloat(params.get('lng')) || 129.2247;
    var level = parseInt(params.get('level'), 10) || 4;

    var myLocationImageSrc = '';
    var currentOverlays = [];
    var pendingData = null; // 지도가 준비되기 전에 init 메시지가 오면 저장해뒀다가 준비되면 적용

    function clearOverlays() {
      currentOverlays.forEach(function (ov) { ov.setMap(null); });
      currentOverlays = [];
    }

    function renderData(data) {
      clearOverlays();
      var markers = data.markers || [];
      var categoryPinUri = data.categoryPinUri || {};
      var categoryPinUriSaved = data.categoryPinUriSaved || {};
      var routePlaces = data.routePlaces || [];
      var routeStartPinUri = data.routeStartPin || '';
      var routeNumberPinUris = data.routeNumberPins || [];
      var routePathPoints = data.routePath || [];
      if (data.myLoc) myLocationImageSrc = data.myLoc;

      markers.forEach(function (place) {
        var el = document.createElement('div');
        el.className = 'place-marker place-marker--' + place.category;
        var pinUri = place.liked
          ? categoryPinUriSaved[place.category]
          : categoryPinUri[place.category];
        el.innerHTML = '<div class="pulse"></div>' + '<img src="' + pinUri + '" />';
        el.addEventListener('click', function () {
          sendMessage({ type: 'markerClick', id: place.id });
        });
        currentOverlays.push(new kakao.maps.CustomOverlay({
          map: window.kakaoMap,
          position: new kakao.maps.LatLng(place.lat, place.lng),
          content: el,
          xAnchor: 0.5,
          yAnchor: 1,
          zIndex: 3,
        }));
      });

      if (routePlaces.length > 0) {
        var hasRealPath = routePathPoints.length > 0;
        var linePath = (hasRealPath ? routePathPoints : routePlaces).map(function (p) {
          return new kakao.maps.LatLng(p.lat, p.lng);
        });
        currentOverlays.push(new kakao.maps.Polyline({
          map: window.kakaoMap,
          path: linePath,
          strokeWeight: 2,
          strokeColor: '#E8906A',
          strokeOpacity: 0.9,
          strokeStyle: 'shortdash',
        }));

        routePlaces.forEach(function (place, idx) {
          var pinUri = idx === 0 ? routeStartPinUri : routeNumberPinUris[idx - 1];
          var el = document.createElement('div');
          el.className = 'route-marker';
          el.innerHTML = '<img src="' + pinUri + '" />';
          el.addEventListener('click', function () {
            sendMessage({ type: 'markerClick', id: place.id });
          });
          currentOverlays.push(new kakao.maps.CustomOverlay({
            map: window.kakaoMap,
            position: new kakao.maps.LatLng(place.lat, place.lng),
            content: el,
            xAnchor: 0.5,
            yAnchor: 1,
            zIndex: idx === 0 ? 6 : 4,
          }));
        });

        var bounds = new kakao.maps.LatLngBounds();
        linePath.forEach(function (pos) { bounds.extend(pos); });
        window.kakaoMap.setBounds(bounds, 80, 80, 80, 80);
      }

      if (data.myLoc && data.myLocLat != null && data.myLocLng != null) {
        var pos = new kakao.maps.LatLng(data.myLocLat, data.myLocLng);
        if (window.myLocationOverlay) {
          window.myLocationOverlay.setPosition(pos);
        } else {
          var myEl = document.createElement('div');
          myEl.className = 'my-location';
          myEl.innerHTML = '<div class="pulse"></div><img src="' + data.myLoc + '" />';
          window.myLocationOverlay = new kakao.maps.CustomOverlay({
            map: window.kakaoMap,
            position: pos,
            content: myEl,
            xAnchor: 0.5,
            yAnchor: 0.5,
            zIndex: 5,
          });
        }
      }
    }

    function initMap() {
      kakao.maps.load(function () {
        var container = document.getElementById('map');
        window.kakaoMap = new kakao.maps.Map(container, {
          center: new kakao.maps.LatLng(centerLat, centerLng),
          level: level,
        });

        kakao.maps.event.addListener(window.kakaoMap, 'click', function () {
          sendMessage({ type: 'mapClick' });
        });

        kakao.maps.event.addListener(window.kakaoMap, 'tilesloaded', function () {
          sendMessage({ type: 'mapReady' });
        });

        if (pendingData) {
          renderData(pendingData);
          pendingData = null;
        }
      });
    }

    var script = document.createElement('script');
    script.src =
      'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' +
      encodeURIComponent(kakaoJsKey) +
      '&autoload=false';
    script.onload = initMap;
    document.body.appendChild(script);

    window.addEventListener('message', function (event) {
      var data = event.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (e) {
          return;
        }
      }
      if (!data) return;

      if (data.type === 'init') {
        if (window.kakaoMap) {
          renderData(data.payload || {});
        } else {
          pendingData = data.payload || {};
        }
        return;
      }

      if (!window.kakaoMap) return;
      if (data.type === 'zoomIn') {
        window.kakaoMap.setLevel(window.kakaoMap.getLevel() - 1, { animate: true });
      } else if (data.type === 'zoomOut') {
        window.kakaoMap.setLevel(window.kakaoMap.getLevel() + 1, { animate: true });
      } else if (data.type === 'moveTo') {
        window.kakaoMap.panTo(new kakao.maps.LatLng(data.lat, data.lng));
      } else if (data.type === 'updateMyLocation') {
        var pos = new kakao.maps.LatLng(data.lat, data.lng);
        if (window.myLocationOverlay) {
          window.myLocationOverlay.setPosition(pos);
        } else {
          var el = document.createElement('div');
          el.className = 'my-location';
          el.innerHTML = '<div class="pulse"></div><img src="' + myLocationImageSrc + '" />';
          window.myLocationOverlay = new kakao.maps.CustomOverlay({
            map: window.kakaoMap,
            position: pos,
            content: el,
            xAnchor: 0.5,
            yAnchor: 0.5,
            zIndex: 5,
          });
        }
      }
    });
  </script>
</body>
</html>
